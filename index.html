<style>
:root{--bg:#e5edf3;--card:#ffffff;--c2:#dce8f1;--gold:#527f9f;--tx:#263b4d;--mu:#657d90;--ok:#25845e;--warn:#b9781d;--bad:#c94f55;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:84px}
main{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 10px;color:var(--gold)}h2{font-size:17px;margin:18px 0 8px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid #c6d6e3;border-radius:14px;padding:14px;margin-bottom:10px}
.stat small{color:var(--mu);display:block}.stat b{font-size:21px;color:var(--gold)}
label{display:block;color:var(--mu);font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #b8ccdc;background:#f5f8fb;color:var(--tx);font:inherit}
button{padding:14px 18px;border:0;border-radius:12px;font:inherit;font-weight:600;background:#527f9f;color:#ffffff;cursor:pointer;margin:8px 8px 0 0}
button.s{background:#547f9f;color:#fff}button.d{background:#ff4d4d;color:#fff}button.sm{padding:8px 12px;margin:0 6px 0 0;font-size:14px}
button.wa{background:#22e06b;color:#04230f;width:100%;font-size:14px;padding:12px 6px;margin:0}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:#dce8f1;border-top:1px solid #c6d6e3;display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:150px;background:none;color:var(--mu);margin:0;padding:8px 2px;font-size:11px;border-radius:10px}
nav button.on{color:var(--gold);background:var(--card)}nav span{display:block;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #c6d6e3}th{color:var(--gold)}
.tw{overflow-x:auto}.r{text-align:right}
.tag{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#06210f}.Paid{background:var(--ok)}.Partially{background:var(--warn)}.Unpaid{background:var(--bad)}.None{background:var(--mu)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #c6d6e3}.item small{color:var(--mu)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
#modal>div{background:var(--card);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#ffffff;padding:10px 18px;border-radius:99px;font-weight:600;display:none;z-index:10}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#cr{position:fixed;left:0;right:0;bottom:0;height:34px;background:#fff3c4;color:#365873;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:4;padding:0 14px env(safe-area-inset-bottom,0px)}.nb{display:none}nav{bottom:34px}body{padding-bottom:130px}
.nl #cr{height:64px;justify-content:flex-start;font-size:13px;line-height:1.25}.nl .nb{display:inline}.nl nav{bottom:64px}.nl body{padding-bottom:170px}
@media print{body{background:#fff;color:#000}nav,#cr,.noprint,button{display:none!important}.card{background:#fff;border-color:#ccc}th,h1,h2{color:#000}td,th{border-color:#ccc}}
#qrprint{display:none}
@media print{body.qrp main,body.qrp nav,body.qrp #cr,body.qrp #modal,body.qrp #toast{display:none!important}body.qrp{padding:0!important}body.qrp #qrprint{display:block!important;text-align:center}body.qrp #qrprint img{width:100%;max-width:170mm;height:auto}}
button{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;box-shadow:0 4px 0 rgba(0,0,0,.38),0 8px 14px rgba(0,0,0,.30);transition:transform .08s ease,box-shadow .08s ease,filter .08s ease}
button::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.10) 50%,rgba(0,0,0,.06) 100%);pointer-events:none}
button:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.3),inset 0 3px 8px rgba(0,0,0,.22);}
button:active::before{background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.16))}button:active,nav button:active{filter:none!important}
button.sm{box-shadow:0 2px 0 rgba(0,0,0,.38),0 4px 8px rgba(0,0,0,.25)}button.sm:active{box-shadow:0 0 0 rgba(0,0,0,.38),inset 0 2px 5px rgba(0,0,0,.35)}
button .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(2.4);opacity:0}}
nav{gap:5px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:#547f9f;color:#fff;border-radius:12px;padding:7px 2px 6px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.45),0 5px 9px rgba(0,0,0,.30)}
nav button::before{display:block}
nav button.on{background:#527f9f;color:#ffffff}
nav button:active{transform:translateY(2px) scale(.96);box-shadow:0 1px 0 rgba(0,0,0,.45),inset 0 3px 7px rgba(0,0,0,.25);}
.tile{display:inline-flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;min-height:58px;margin:0;padding:10px 8px;font-size:14px;line-height:1.2;text-align:left;border-radius:16px}
.tile .ti{font-size:24px;line-height:1;flex:0 0 auto}.tile .tl{display:block}
.tile .ti,.tile .tl{position:relative;z-index:1}
.tile:active{filter:saturate(1.8)}.tile:active::before{mix-blend-mode:normal;background:rgba(255,255,255,.18)}

const HDB='JugnuWaterHandles';

 <div class="row"><div style="flex:0 0 90px"><label>Country</label><input id="sc" value="+${esc(sp.cc)}"></div><div><label>WhatsApp number</label><input id="sph" type="tel" placeholder="3001234567" value="${esc(sp.phone)}"></div></div><button onclick="saveSup()">Save Supplier</button></div>
 <div class="card"><b>💾 Backup &amp; Restore</b><p style="color:var(--mu);font-size:14px">Keep a copy of your records safe. If you change phone or browser, use Restore to load that copy.</p><button onclick="backup()">⬇ Save Backup</button><button class="s" onclick="restoreUI()">📂 Restore from Backup</button><p style="color:var(--mu);font-size:12px;margin-bottom:0">Backup is saved as one file in your Downloads folder. Save it somewhere safe.</p></div>
 <div class="card"><b style="color:var(--bad)">⚠ Data reset</b><p style="color:var(--mu);font-size:13px">Only use this if you want to remove all records from this device.</p><button class="d" onclick="eraseStep1()">Erase all data</button></div>
 <div class="card"><b>📱 Share App (QR Code)</b><p style="color:var(--mu);font-size:14px">Scan to open JUGNU Mineral Water. Download, print or share the QR code.</p><label>Application link used in the QR code</label><input id="aurl" value="${esc(appUrl())}" placeholder="https://jugnutechpk.github.io/jugnu-mineralwater/"><button class="s" onclick="saveAppUrl()">Save Link</button><button id="qrbtn" onclick="showQR()">Show QR Code</button></div>`}
function savePrice(){const p=intv($('np').value,1,100000),e=$('ne').value;if(p===null||!e)return toast('Enter a valid price and date');setPrice(p,e);save();render();toast('Price saved')}
function saveSup(){const ph=$('sph').value.replace(/\D/g,''),cc=$('sc').value.replace(/\D/g,'');if(ph&&ph.length<7)return toast('Number looks too short');if(!cc)return toast('Enter country code');S.supplier={name:$('sn').value.trim(),phone:ph,cc};save();toast('Supplier saved')}
function backup(){dlBackup(true)}
function restoreUI(){modal(`<b>📂 Restore from Backup</b><p style="color:var(--mu);font-size:14px">Choose the JUGNU backup file you saved earlier. Your current records will be replaced after confirmation.</p><label>Select backup file</label><input type="file" accept=".json,application/json" onchange="rf(this.files[0])"><button class="s" onclick="closeM()">Cancel</button>`)}
function rf(f){if(!f)return;f.text().then(t=>doRestore(t)).catch(()=>toast('Could not read this backup file'))}
function validISODate(v){if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T00:00:00Z');return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===v}
function validPositive(n){return typeof n==='number'&&Number.isFinite(n)&&n>0}
function validateBackup(o){
 if(!o||typeof o!=='object'||Array.isArray(o)||!Array.isArray(o.deliveries)||!Array.isArray(o.payments)||!Array.isArray(o.prices))return false;
 if(o.deliveries.some(x=>!x||!Number.isInteger(x.id)||x.id<1||!validISODate(x.date)||!Number.isInteger(x.qty)||x.qty<1||x.qty>999||!validPositive(x.price)||!validPositive(x.amount)||x.amount!==x.qty*x.price||(x.remarks!=null&&typeof x.remarks!=='string')))return false;
 if(o.payments.some(x=>!x||!Number.isInteger(x.id)||x.id<1||!validISODate(x.date)||!validPositive(x.amount)||(x.note!=null&&typeof x.note!=='string')))return false;
 if(o.prices.some(x=>!x||!Number.isInteger(x.id)||x.id<1||!validISODate(x.effective)||!validPositive(x.price)))return false;
 if(o.orders!=null&&(!Array.isArray(o.orders)||o.orders.some(x=>!x||!Number.isInteger(x.id)||x.id<1||!validISODate(x.date)||!Number.isInteger(x.qty)||x.qty<1||x.qty>999||(x.name!=null&&typeof x.name!=='string')||(x.phone!=null&&typeof x.phone!=='string')||(x.note!=null&&typeof x.note!=='string')||(x.need!=null&&typeof x.need!=='string'))))return false;
 const validOrder=x=>!!x&&Number.isInteger(x.id)&&x.id>0&&validISODate(x.date)&&Number.isInteger(x.qty)&&x.qty>=1&&x.qty<=999&&(x.name==null||typeof x.name==='string')&&(x.phone==null||typeof x.phone==='string')&&(x.note==null||typeof x.note==='string')&&(x.need==null||typeof x.need==='string')&&(x.orderNo==null||typeof x.orderNo==='string');
 if(o.orders!=null&&(!Array.isArray(o.orders)||o.orders.some(x=>!validOrder(x))))return false;
 if(o.suppliedOrders!=null&&(!Array.isArray(o.suppliedOrders)||o.suppliedOrders.some(x=>!validOrder(x)||!validISODate(x.suppliedDate||x.date))))return false;
 if(o.supplier!=null&&(typeof o.supplier!=='object'||Array.isArray(o.supplier)||(o.supplier.name!=null&&typeof o.supplier.name!=='string')||(o.supplier.phone!=null&&typeof o.supplier.phone!=='string')||(o.supplier.cc!=null&&typeof o.supplier.cc!=='string')))return false;
 if(o.seq!=null&&(!Number.isInteger(o.seq)||o.seq<1))return false;
 return true;
}
function doRestore(t){let o;try{o=JSON.parse(t);if(!validateBackup(o))throw new Error('invalid structure')}catch(e){return toast('Invalid backup file or damaged records')}
 ask('Replace ALL current data with this backup?',()=>{const next=Object.assign(fresh(),o);next.orders=Array.isArray(o.orders)?o.orders:[];next.suppliedOrders=Array.isArray(o.suppliedOrders)?o.suppliedOrders:[];const ids=[...next.deliveries,...next.payments,...next.prices,...next.orders,...next.suppliedOrders].map(x=>x.id||0);next.seq=Math.max(Number(next.seq)||1,...ids.map(x=>x+1));next.orderSeq=Math.max(Number(next.orderSeq)||1,...[...next.orders,...next.suppliedOrders].map(x=>{const m=String(x.orderNo||'').match(/(\d+)$/);return m?Number(m[1])+1:1}));S=next;save();render();toast('Restored')})}
function sample(){const c=mk(today()),[y,m]=c.split('-').map(Number),pm=m==1?(y-1)+'-12':y+'-'+pad(m-1);S=fresh();S.prices=[{id:1,effective:pm+'-01',price:100},{id:2,effective:c+'-03',price:120}];S.seq=10;
 [[pm+'-03',3],[pm+'-10',2],[pm+'-17',3],[pm+'-24',2]].forEach(([d,q])=>addDel({date:d,qty:q,price:100}));addPay({date:pm+'-28',amount:1000,note:'Cash'});
 [[c+'-01',3],[c+'-02',2],[c+'-03',3]].forEach(([d,q])=>addDel({date:d,qty:q,price:priceOn(d)}));addPay({date:c+'-05',amount:300,note:'Partial'});
 S.supplier={name:'Water Supplier',phone:'3001234567',cc:'92'};save();render();toast('Sample data loaded')}
function selfTest(){const bak=S,res=[],t=(n,ok)=>res.push(`<div class="${ok?'ok':'bad'}">${ok?'✔':'✖'} ${n}</div>`);
 try{S=fresh();S.prices=[{id:1,effective:'2026-10-01',price:100}];
 const o=addDel({date:'2026-10-20',qty:1,price:priceOn('2026-10-20')});const oct=JSON.stringify(stats('2026-10'));
 const a=addDel({date:'2026-11-02',qty:3,price:priceOn('2026-11-02')});t('Supply 3 × Rs.100 = Rs.300',a.amount==300);
 setPrice(120,'2026-11-05');const b=addDel({date:'2026-11-06',qty:2,price:priceOn('2026-11-06')});
 t('Price change keeps first at Rs.300, second Rs.240',a.amount==300&&a.price==100&&b.amount==240&&b.price==120);
 t('Monthly total Rs.540',stats('2026-11').bill==540);addPay({date:'2026-11-07',amount:300});
 const s=stats('2026-11');t('Balance Rs.240, status Partially Paid',s.bal==240&&s.status=='Partially Paid');
 S.supplier={name:'X',phone:'0300-1234567',cc:'92'};const w=waMsg();t('WhatsApp message data',w.includes('06-11-2026')&&/Bottles Received\s+: 2/.test(w)&&/Today's Amount\s+: Rs\. 240/.test(w)&&/Balance\s+: Rs\. 240/.test(w)&&w.includes('🟡'));
 t('Order message (5 bottles, Rs.600)',orderMsg(5,'','').includes('5 x 19L')&&orderMsg(5,'','').includes('Rs. 600'));t('WhatsApp number → 923001234567',waNumber()=='923001234567');
 Object.assign(b,{qty:3,amount:3*b.price});t('Edit: 3 × Rs.120 = Rs.360, total Rs.660',b.amount==360&&stats('2026-11').bill==660);
 const bk=JSON.stringify(S);S=Object.assign(fresh(),JSON.parse(bk));t('Backup / restore round-trip',JSON.stringify(S)==bk&&stats('2026-11').bill==660);
 t('Previous month (Oct) unchanged',JSON.stringify(stats('2026-10'))==oct&&o.amount==100);
 const savedPrices=S.prices;S.prices=[{id:1,effective:'2026-11-10',price:150}];t('No future price applied to an earlier date',priceOn('2026-11-09')==0);S.prices=savedPrices;
 S.deliveries=[];S.payments=[];addPay({date:'2026-11-08',amount:500});const over=stats('2026-11');t('Excess payment stays in its own month (no negative balance)',over.bal==0&&over.excess==500&&over.status=='No supplies');
 addDel({date:'2026-12-01',qty:1,price:100});t('Excess payment is not carried into next month',stats('2026-12').paid==0&&stats('2026-12').bal==100);
 const good=JSON.stringify({deliveries:[{id:1,date:'2026-11-01',qty:2,price:100,amount:200}],payments:[],prices:[{id:1,effective:'2026-10-01',price:100}],seq:2});t('Backup validator accepts valid records',validateBackup(JSON.parse(good)));const bad=JSON.parse(good);bad.deliveries[0].amount=999;t('Backup validator rejects damaged amount',!validateBackup(bad))}catch(e){t('Error: '+e.message,false)}
 S=bak;$('tr').innerHTML='<h2>Self-test (no data touched)</h2>'+res.join('')}
