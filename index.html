html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:84px}
main{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 10px;color:var(--gold)}h2{font-size:17px;margin:18px 0 8px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid #223a6b;border-radius:14px;padding:14px;margin-bottom:10px}
.stat small{color:var(--mu);display:block}.stat b{font-size:21px;color:var(--gold)}
label{display:block;color:var(--mu);font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #2c4a86;background:#0d1f40;color:var(--tx);font:inherit}
button{padding:14px 18px;border:0;border-radius:12px;font:inherit;font-weight:600;background:var(--gold);color:#1a1405;cursor:pointer;margin:8px 8px 0 0}
button.s{background:var(--c2);color:var(--tx)}button.d{background:var(--bad);color:#fff}button.sm{padding:8px 12px;margin:0 6px 0 0;font-size:14px}
button.wa{background:#25d366;color:#04230f;width:100%;font-size:14px;padding:12px 6px;margin:0}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:#091428;border-top:1px solid #223a6b;display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:150px;background:none;color:var(--mu);margin:0;padding:8px 2px;font-size:11px;border-radius:10px}
nav button.on{color:var(--gold);background:var(--card)}nav span{display:block;font-size:20px}

.tw{overflow-x:auto}.r{text-align:right}
.tag{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#06210f}.Paid{background:var(--ok)}.Partially{background:var(--warn)}.Unpaid{background:var(--bad)}.None{background:var(--mu)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #223a6b}.item small{color:var(--mu)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
#modal>div{background:var(--card);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:10px 18px;border-radius:99px;font-weight:600;display:none;z-index:10}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#cr{position:fixed;left:0;right:0;bottom:0;height:34px;background:#fff3c4;color:#0b1a33;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:4;padding:0 14px env(safe-area-inset-bottom,0px)}.nb{display:none}nav{bottom:34px}body{padding-bottom:130px}
.nl #cr{height:64px;justify-content:flex-start;font-size:13px;line-height:1.25}.nl .nb{display:inline}.nl nav{bottom:64px}.nl body{padding-bottom:170px}
@media print{body{background:#fff;color:#000}nav,#cr,.noprint,button{display:none!important}.card{background:#fff;border-color:#ccc}th,h1,h2{color:#000}td,th{border-color:#ccc}}

function dlBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const cvBlob=cv=>new Promise(r=>cv.toBlob(r,'image/png'));

function savePrice(){const p=intv($('np').value,1,100000),e=$('ne').value;if(p===null||!e)return toast('Enter a valid price and date');setPrice(p,e);save();render();toast('Price saved')}
function saveSup(){const ph=$('sph').value.replace(/\D/g,''),cc=$('sc').value.replace(/\D/g,'');if(ph&&ph.length<7)return toast('Number looks too short');if(!cc)return toast('Enter country code');S.supplier={name:$('sn').value.trim(),phone:ph,cc};save();toast('Supplier saved')}

function restoreUI(){modal(`<b>Restore backup</b><label>Choose a backup file</label><input type="file" accept=".json,application/json" onchange="rf(this.files[0])"><label>…or paste backup text</label><textarea id="rt" rows="5"></textarea><button onclick="doRestore($('rt').value)">Restore</button><button class="s" onclick="closeM()">Cancel</button>`)}
function rf(f){if(f)f.text().then(t=>{$('rt').value=t})}
function doRestore(t){let o;try{o=JSON.parse(t);if(!Array.isArray(o.deliveries)||!Array.isArray(o.payments)||!Array.isArray(o.prices))throw 0}catch(e){return toast('Invalid backup file')}
